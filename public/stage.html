<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNSCRIPTED — Stage</title>
<style>
  :root{
    --bg:#05060a; --bg2:#0b0e16; --fg:#eef1f8; --dim:#8891a7;
    --gold:#d4af37; --border:rgba(255,255,255,0.12); --panel:rgba(255,255,255,0.04);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg) 60%);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .stage{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vh 6vw;}
  .brand-mark{position:fixed;top:2.2rem;left:2.5rem;font-size:0.95rem;letter-spacing:0.4em;text-transform:uppercase;color:var(--dim);}

  .view{width:100%;max-width:1200px;}

  .idle-title{font-size:clamp(3rem,8vw,7.5rem);letter-spacing:0.06em;margin:0;font-weight:700;}
  .idle-tagline{font-size:clamp(1.1rem,2.2vw,1.9rem);color:var(--dim);margin-top:1.8rem;}

  .headline{font-size:clamp(2.4rem,6.5vw,6.5rem);margin:0;line-height:1.1;font-weight:700;opacity:1;transition:opacity 0.6s ease;}

  .closing-text{font-size:clamp(1.9rem,4.2vw,3.6rem);font-weight:500;line-height:1.4;color:var(--fg);}

  .corner-time{position:fixed;bottom:2.2rem;right:2.5rem;font-family:var(--mono);font-size:0.8rem;color:var(--dim);letter-spacing:0.04em;}

  .prediction-panel{
    position:fixed;bottom:2.2rem;left:2.5rem;
    border:1px solid var(--border);background:var(--panel);
    border-radius:16px;padding:1.2rem 1.5rem;max-width:360px;text-align:left;
    backdrop-filter:blur(6px);
  }
  .prediction-label{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);margin-bottom:0.6rem;}
  .prediction-sealed{font-size:1rem;color:var(--fg);display:flex;align-items:center;gap:0.5rem;}
  .prediction-lock{font-size:0.95rem;}
  .prediction-fingerprint{font-family:var(--mono);font-size:0.78rem;color:var(--dim);margin-top:0.5rem;letter-spacing:0.03em;}
  .prediction-open-text, .prediction-revealed-text{font-size:1.4rem;font-weight:700;color:var(--gold);line-height:1.35;}
  .prediction-sealed-note{font-size:0.8rem;color:var(--dim);margin-top:0.6rem;}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand-mark" id="brandMark" hidden>UNSCRIPTED</div>

  <section class="view idle-view" id="idleView">
    <h1 class="idle-title" id="idleTitle">UNSCRIPTED</h1>
    <p class="idle-tagline">Fable knows the trick. I don't.</p>
  </section>

  <section class="view live-view" id="liveView" hidden>
    <h1 class="headline" id="headline"></h1>
  </section>

  <section class="view ended-view" id="endedView" hidden>
    <p class="closing-text" id="closingText"></p>
  </section>

  <div class="corner-time" id="cornerTime" hidden></div>

  <div class="prediction-panel" id="predictionPanel" hidden>
    <div class="prediction-label">Fable's Prediction</div>
    <div id="predictionBody"></div>
  </div>
</div>
<script>
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function connect(){
    var es = new EventSource('/events');
    es.addEventListener('state', function(e){
      try{
        var state = JSON.parse(e.data);
        render(state);
      }catch(err){ /* ignore malformed payloads, nothing to show on stage */ }
    });
  }

  function setHeadline(text){
    var el = document.getElementById('headline');
    if(el.dataset.val === text) return;
    el.dataset.val = text;
    el.style.opacity = '0';
    requestAnimationFrame(function(){
      el.textContent = text;
      requestAnimationFrame(function(){ el.style.opacity = '1'; });
    });
  }

  function render(state){
    var phase = state.phase;
    var showIdle = phase === 'idle' || phase === 'setup' || !phase;

    document.getElementById('idleView').hidden = !showIdle;
    document.getElementById('liveView').hidden = phase !== 'live';
    document.getElementById('endedView').hidden = phase !== 'ended';
    document.getElementById('brandMark').hidden = showIdle;

    var stage = state.stage || {};

    if(showIdle){
      document.getElementById('idleTitle').textContent = stage.title || 'UNSCRIPTED';
    }

    if(phase === 'live'){
      var line = stage.line;
      setHeadline(line && line.text ? line.text : '');
      var cornerTime = document.getElementById('cornerTime');
      if(line && line.time){ cornerTime.hidden = false; cornerTime.textContent = line.time; }
      else { cornerTime.hidden = true; }
      renderPrediction(stage.prediction);
    } else {
      document.getElementById('cornerTime').hidden = true;
      // The reveal is the climax: it stays up after the show ends.
      renderPrediction(phase === 'ended' ? stage.prediction : null);
    }

    if(phase === 'ended'){
      document.getElementById('closingText').textContent = state.closing || '';
    }
  }

  function renderPrediction(pred){
    var panel = document.getElementById('predictionPanel');
    if(!pred){ panel.hidden = true; return; }
    panel.hidden = false;
    var body = document.getElementById('predictionBody');
    var html = '';
    if(pred.revealed_text){
      html += '<div class="prediction-revealed-text">' + esc(pred.revealed_text) + '</div>';
      html += '<div class="prediction-sealed-note">Sealed at ' + esc(pred.time || '') + '</div>';
    } else if(pred.sealed){
      html += '<div class="prediction-sealed"><span class="prediction-lock">&#128274;</span>Sealed at ' + esc(pred.time || '') + '</div>';
      html += '<div class="prediction-fingerprint">' + esc(pred.fingerprint || '') + '</div>';
    } else {
      html += '<div class="prediction-open-text">' + esc(pred.text || '') + '</div>';
    }
    body.innerHTML = html;
  }

  connect();
</script>
</body>
</html>
